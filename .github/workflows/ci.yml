name: CI

on:
  push:
    # The repository's default branch: there is no main.
    branches: [develop]
  pull_request:
  # Run by hand from the Actions tab, without pushing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.x"]
        include:
          # Oldest supported version (see README).
          - os: windows-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q src tests demo
      - name: Test
        run: python -m unittest -v

  # The page's pure logic, with Node's built-in runner (tests/js): nothing to install.
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: node --test tests/js/

  # Share of the server's lines the tests run: shown on the run's summary, and a floor a change may not
  # lower the total under.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Coverage alone, at its pinned version: with Playwright but no browser, the browser tests would fail
      # here instead of being skipped.
      - name: Install coverage
        run: python -m pip install "$(grep '^coverage==' requirements-dev.txt)"
      - name: Measure
        run: python -m coverage run --source=src/camelopard -m unittest
      - name: Report
        run: |
          python -m coverage report --format=markdown --sort=cover >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --fail-under=80

  # The page in a real browser, against the demo's fake Jira (tests/e2e).
  browser:
    runs-on: ubuntu-latest
    env:
      # A missing Playwright fails the job instead of skipping the tests.
      CAMELOPARD_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install the development tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: python -m unittest -v tests.e2e.test_board
