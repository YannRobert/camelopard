name: CI

on:
  push:
    # The repository's default branch: there is no main.
    branches: [develop]
  pull_request:
  # Run by hand from the Actions tab, without pushing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.x"]
        include:
          # Oldest supported version (see README).
          - os: windows-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q src tests demo
      - name: Test
        run: python -m unittest -v
